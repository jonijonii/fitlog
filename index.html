<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111827">
<title>FitLog</title>

<!-- 홈 화면에 추가했을 때 앱처럼 뜨게 하는 설정.
     iOS 는 manifest 를 거의 안 보고 아래 apple-* 메타를 본다. 둘 다 넣는다.
     status-bar-style 을 black-translucent 로 하면 밝은 테마에서 상태바 글씨가 안 보여서 default 로 둔다. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FitLog">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* FitLog — 모바일 퍼스트(기준 375px) */

:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f4;
  --text: #16181d;
  --text-dim: #5f6673;
  --line: #dfe3ea;
  --accent: #2f6df6;
  --accent-soft: #e6eefe;
  --ok: #1a9e5c;
  --warn: #d98014;
  --bad: #d84a3f;
  --radius: 14px;
  --tabbar-h: 58px;
  --pad: 16px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #212630;
    --text: #e8eaee;
    --text-dim: #9aa2b1;
    --line: #2b313c;
    --accent: #5b8cff;
    --accent-soft: #1c2740;
    --ok: #3fc07d;
    --warn: #e5a13f;
    --bad: #f0736a;
  }
}

* { box-sizing: border-box; }

/* hidden 속성이 항상 이기게 한다.
 *
 * 브라우저 기본 스타일시트에 [hidden]{display:none} 이 있지만, 작성자 스타일은
 * 기본 스타일시트를 무조건 이긴다. 그래서 .onboarding{display:flex} 같은 규칙 하나가
 * el.hidden = true 를 무력화한다 — 자바스크립트는 멀쩡히 돌고 화면만 안 바뀌므로
 * 에러도 안 나고 원인도 안 보인다. 실제로 온보딩이 이 문제로 안 닫혔다.
 * 요소마다 [hidden] 예외를 다는 대신 여기서 한 번에 못 박는다. */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
               "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }

/* ---------- 레이아웃 ---------- */

.app { min-height: 100vh; }

.screen {
  padding: calc(env(safe-area-inset-top) + 12px) var(--pad)
           calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 24px);
  max-width: 640px;
  margin: 0 auto;
}

.screen-title { font-size: 22px; margin-bottom: 4px; }
.screen-sub { color: var(--text-dim); font-size: 14px; margin: 0 0 16px; }

/* ---------- 탭바 ---------- */

.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 40;
}

.tab {
  min-height: 44px;
  height: var(--tabbar-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  text-decoration: none;
  color: var(--text-dim);
  font-size: 11px;
  -webkit-tap-highlight-color: transparent;
}

.tab-ico { font-size: 17px; line-height: 1; }
.tab[aria-selected="true"] { color: var(--accent); font-weight: 700; }

/* ---------- 카드 ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

.card-title { font-size: 15px; margin-bottom: 10px; }
.card-note { font-size: 13px; color: var(--text-dim); margin: 8px 0 0; }

.muted { color: var(--text-dim); }
.small { font-size: 13px; }

/* ---------- 링 ---------- */

.rings { display: flex; gap: 12px; justify-content: center; }

.ring-item { text-align: center; flex: 1; }
.ring-item svg { display: block; margin: 0 auto; }
.ring-name { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
.ring-val { font-size: 15px; font-weight: 700; }

.ring-track { stroke: var(--surface-2); }
.ring-fill { stroke: var(--accent); stroke-linecap: round; }
.ring-center { fill: var(--text); font-size: 15px; font-weight: 700; text-anchor: middle; }
.ring-center-sub { fill: var(--text-dim); font-size: 10px; text-anchor: middle; }

/* ---------- 데이터 행 ---------- */

.rows { display: flex; flex-direction: column; gap: 2px; }

.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row-key { color: var(--text-dim); font-size: 14px; }
.row-val { font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- 폼 ---------- */

.field { margin-bottom: 14px; }

.field > label,
.field-label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
}

.field-hint { font-size: 13px; color: var(--text-dim); margin: 6px 0 0; }

input[type="text"],
input[type="number"],
input[type="date"],
select {
  width: 100%;
  min-height: 48px;
  font-size: 16px;
  font-family: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
}

input:focus, select:focus, .btn:focus-visible, .chip:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.field-inline { display: flex; gap: 10px; }
.field-inline > * { flex: 1; }

.suffix { position: relative; }
.suffix > span {
  position: absolute;
  right: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 14px;
  pointer-events: none;
}

/* 칩(단일 선택) */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 22px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  cursor: pointer;
}
.chip[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}

/* 카운터 */
.counter { display: flex; align-items: center; gap: 12px; }
.counter-btn {
  width: 44px; height: 44px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
}
.counter-val { font-size: 18px; font-weight: 700; min-width: 62px; text-align: center; }

/* ---------- 버튼 ---------- */

.btn {
  min-height: 48px;
  padding: 12px 18px;
  border-radius: 12px;
  border: 1px solid transparent;
  font-size: 16px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  background: var(--surface-2);
  color: var(--text);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--text-dim); }
.btn-danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }

.btn-stack { display: flex; flex-direction: column; gap: 10px; }

/* ---------- 알림 배너 ---------- */

.notice {
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.55;
  margin-bottom: 12px;
}
.notice-info { background: var(--accent-soft); color: var(--text); }
.notice-warn { background: color-mix(in srgb, var(--warn) 16%, transparent); }

/* ---------- 온보딩 ---------- */

.onboarding {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 60;
  display: flex;
  flex-direction: column;
}

.ob-shell {
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}

.ob-head {
  padding: calc(env(safe-area-inset-top) + 20px) var(--pad) 8px;
}

.ob-steps { display: flex; gap: 6px; margin-bottom: 16px; }
.ob-steps > i {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--surface-2);
}
.ob-steps > i.on { background: var(--accent); }

.ob-title { font-size: 22px; }
.ob-desc { color: var(--text-dim); font-size: 14px; margin: 6px 0 0; }

.ob-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px var(--pad) 8px;
  -webkit-overflow-scrolling: touch;
}

.ob-foot {
  display: flex;
  gap: 10px;
  padding: 12px var(--pad) calc(env(safe-area-inset-bottom) + 14px);
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.ob-foot .btn { flex: 1; }
.ob-foot .btn-primary { flex: 2; }

.error-text { color: var(--bad); font-size: 13px; margin-top: 6px; }

/* ---------- 토스트 ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px);
  transform: translateX(-50%);
  background: #22262f;
  color: #fff;
  padding: 12px 18px;
  border-radius: 22px;
  font-size: 14px;
  max-width: calc(100% - 32px);
  text-align: center;
  z-index: 80;
}

/* ---------- 매크로 요약 ---------- */

.macro-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}

.macro-cell { text-align: center; }
.macro-name { display: block; font-size: 12px; color: var(--text-dim); }
.macro-val {
  display: block;
  font-size: 13px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}
.macro-over .macro-val { color: var(--warn); }

/* ---------- 끼니 ---------- */

.meal-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 0 6px;
  border-top: 1px solid var(--line);
  margin-top: 6px;
}
.meal-head:first-of-type { border-top: 0; margin-top: 0; }

.meal-type { font-size: 15px; font-weight: 700; }
.meal-kcal {
  flex: 1;
  font-size: 13px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.meal-add {
  width: 44px; height: 44px;
  flex: 0 0 44px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--accent);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}

.meal-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  background: var(--surface-2);
  border-radius: 10px;
  margin-bottom: 6px;
}

.meal-item-main { flex: 1; min-width: 0; }
.meal-label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.meal-portion {
  display: inline-block;
  font-size: 11px;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 8px;
  padding: 1px 6px;
  margin-top: 2px;
}
.meal-item-kcal {
  font-size: 12px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.meal-del {
  width: 44px; height: 44px;
  flex: 0 0 44px;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font-size: 15px;
  cursor: pointer;
}

/* ---------- 보충제 체크리스트 ---------- */

.slot-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 12px 0 6px;
  border-top: 1px solid var(--line);
  margin-top: 6px;
}
.slot-head:first-of-type { border-top: 0; margin-top: 0; padding-top: 2px; }

.slot-label { font-size: 14px; font-weight: 700; }
.slot-passed { font-size: 11px; color: var(--text-dim); }

.sup-item {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  margin-bottom: 6px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.sup-check {
  width: 26px; height: 26px;
  flex: 0 0 26px;
  border-radius: 8px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: transparent;
}

.sup-on { border-color: var(--accent); background: var(--accent-soft); }
.sup-on .sup-check { background: var(--accent); border-color: var(--accent); color: #fff; }

/* 지난 시간대인데 아직 안 먹은 것 — 재촉이 아니라 눈에 띄게만 */
.sup-missed { border-color: var(--warn); }
.sup-missed .sup-name::after { content: ' ·'; color: var(--warn); }

.sup-body { flex: 1; min-width: 0; }
.sup-name { display: block; font-size: 14px; font-weight: 600; }
.sup-amount { display: block; font-size: 12px; color: var(--text-dim); }

/* ---------- 차트 ---------- */

.chart-box { margin: 4px 0 10px; }
.chart { display: block; overflow: visible; }

.chart-grid { stroke: var(--line); stroke-width: 1; }
.chart-axis { fill: var(--text-dim); font-size: 9px; }

.chart-line { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart-line-0, .chart-dot-0 { stroke: var(--accent); }
.chart-line-1, .chart-dot-1 { stroke: var(--warn); }
.chart-dot { fill: var(--surface); stroke-width: 2; }

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 4px;
}
.chart-key { display: inline-flex; align-items: center; gap: 5px; }
.chart-swatch { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.chart-swatch-0 { background: var(--accent); }
.chart-swatch-1 { background: var(--warn); }

/* ---------- 영양소 막대 ---------- */

.nbar { margin-bottom: 10px; }

.nbar-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}
.nbar-name { font-size: 13px; }
.nbar-val {
  font-size: 12px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.nbar-track {
  position: relative;
  height: 8px;
  border-radius: 4px;
  background: var(--surface-2);
  overflow: hidden;
}

/* 목표선 — 막대가 어디까지 차야 하는지 보여준다 (표시 범위 150% 중 100% 지점) */
.nbar-goal {
  position: absolute;
  left: 66.6%;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--text-dim);
  opacity: .5;
}

.nbar-fill { display: block; height: 100%; border-radius: 4px; }
.nbar-low    { background: var(--bad); }
.nbar-midLow { background: var(--warn); }
.nbar-ok     { background: var(--ok); }
.nbar-over   { background: var(--warn); }

/* ---------- 운동 입력 ---------- */

.workout-form {
  padding: 12px 0 4px;
  border-top: 1px solid var(--line);
  margin-top: 10px;
}

/* ---------- 알림 ---------- */

.alert {
  font-size: 13px;
  line-height: 1.6;
  padding: 10px 12px;
  border-radius: 10px;
  margin: 0 0 8px;
  border-left: 3px solid var(--line);
  background: var(--surface-2);
}
.alert:last-child { margin-bottom: 0; }
.alert-warn { border-left-color: var(--bad); }
.alert-info { border-left-color: var(--accent); }
.alert-tip  { border-left-color: var(--warn); }
.alert-good { border-left-color: var(--ok); }

/* ---------- 보충제 관리 ---------- */

.sup-edit { border-top: 1px solid var(--line); }

.sup-edit-head {
  width: 100%;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 2px;
  border: 0;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}
.sup-edit-name { font-size: 15px; font-weight: 600; }
.sup-off { color: var(--text-dim); font-weight: 400; }
.sup-edit-slot { font-size: 13px; color: var(--text-dim); }

.sup-edit-body { padding: 4px 2px 16px; }

.nut-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.nut-label { flex: 1; font-size: 13px; color: var(--text-dim); }
.nut-row input { flex: 0 0 110px; min-height: 44px; }

.nut-del {
  width: 44px; height: 44px;
  flex: 0 0 44px;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font-size: 14px;
  cursor: pointer;
}

.custom-sup {
  padding: 12px 0 4px;
  border-top: 1px solid var(--line);
  margin-top: 8px;
}

/* ---------- 선택 시트 ---------- */

body.sheet-open { overflow: hidden; }

.sheet { position: fixed; inset: 0; z-index: 70; }
.sheet[hidden] { display: none; }

.sheet-scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); }

.sheet-panel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  max-width: 640px;
  margin: 0 auto;
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border-radius: 18px 18px 0 0;
  border: 1px solid var(--line);
  border-bottom: 0;
  overflow: hidden;
}

/* 시트는 세로 flex 다. 머리말·검색·탭은 줄어들면 안 되고 목록만 남는 공간을 쓴다.
   flex-shrink 기본값이 1이라 이걸 안 막으면 목록에 밀려 탭 줄이 찌그러진다. */
.sheet-head, .sheet-search, .sheet-tabs { flex: 0 0 auto; }

.sheet-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px var(--pad) 8px;
}
.sheet-title { flex: 1; font-size: 17px; }
.sheet-close {
  width: 44px; height: 44px;
  border: 0;
  background: transparent;
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
}

.sheet-search { padding: 0 var(--pad) 10px; }
.sheet-search input {
  width: 100%;
  min-height: 46px;
  font-size: 16px;
  font-family: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
}

.sheet-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 0 var(--pad) 10px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.sheet-tabs::-webkit-scrollbar { display: none; }
.sheet-tabs[hidden] { display: none; }

.sheet-tab {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-dim);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}
.sheet-tab[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
}

.sheet-body {
  flex: 1;
  overflow-y: auto;
  padding: 4px var(--pad) calc(env(safe-area-inset-bottom) + 20px);
  -webkit-overflow-scrolling: touch;
}

.sheet-empty, .sheet-hint {
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.6;
  padding: 12px 2px;
  margin: 0;
}

/* 항목 행 */
.pick {
  border-bottom: 1px solid var(--line);
}

<script>
/* store.js — localStorage 데이터 레이어 (읽기 / 쓰기 / 마이그레이션) */

window.FitLog = window.FitLog || {};

(function (FitLog) {
  'use strict';

  // 저장 키는 앱 네임스페이스라 고정. 데이터 모양이 바뀌면 SCHEMA_VERSION 만 올린다.
  var STORAGE_KEY = 'fitlog.v1';
  var SCHEMA_VERSION = 2;

  /* ---------- 기본값 ---------- */

  function emptyState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      profile: null,          // 온보딩 완료 전에는 null
      targets: null,          // profile 기반 자동 계산
      supplements: [],
      dailyLogs: {},
      bodyLogs: [],
      customFoods: [],
      favorites: [],    // 'template:<id>' / 'food:<id>' / 'custom:<id>'
      meta: { lastBackupAt: null }   // 마지막 백업 시각. 데이터 유실 노출도를 보여주는 데 쓴다
    };
  }

  function emptyDay() {
    return {
      meals: [],
      alcohol: { drank: false, kcal: 0, note: '' },
      supplementsTaken: [],
      workouts: [],
      waterMl: 0,
      note: ''
    };
  }

  /* ---------- 날짜 유틸 (로컬 타임존 기준 YYYY-MM-DD) ---------- */

  // 이 앱은 ES5 문법·내장 함수만 쓴다. 구형 모바일 브라우저에서 스크립트가 통째로
  // 죽는 걸 막기 위해서다. padStart(ES2017) 대신 직접 두 자리로 채운다.
  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function todayKey(d) {
    var t = d ? new Date(d) : new Date();
    return t.getFullYear() + '-' + pad2(t.getMonth() + 1) + '-' + pad2(t.getDate());
  }

  /* ---------- 마이그레이션 ----------
     저장된 데이터의 schemaVersion 이 현재보다 낮으면 단계별로 올린다.
     지금은 v1 이 최초 버전이라 실제 변환 단계는 없고,
     누락 필드를 채워 넣는 정규화만 수행한다. */

  var migrations = {
    // v1 → v2: 목표가 단일 선택(goal)에서 복수 선택(goals)으로 바뀌었다.
    1: function (s) {
      upgradeProfileGoals(s.profile);
      s.schemaVersion = 2;
      return s;
    }
  };

  /** profile.goal(문자열) → profile.goals(배열). 이미 배열이면 그대로 둔다. */
  function upgradeProfileGoals(profile) {
    if (!profile || typeof profile !== 'object') return profile;
    if (!Array.isArray(profile.goals)) {
      profile.goals = profile.goal ? [profile.goal] : ['maintain'];
    }
    delete profile.goal;
    return profile;
  }

  function migrate(raw) {
    var state = raw && typeof raw === 'object' ? raw : emptyState();
    var version = Number(state.schemaVersion) || 0;

    while (version < SCHEMA_VERSION && migrations[version]) {
      state = migrations[version](state);
      version = Number(state.schemaVersion) || version + 1;
    }

    // 미래 버전 데이터를 읽은 경우(다른 기기에서 최신 앱 사용) — 덮어쓰지 않고 그대로 둔다.
    if (version > SCHEMA_VERSION) return state;

    return normalize(state);
  }

  function normalize(state) {
    var base = emptyState();
    if (!state || typeof state !== 'object') return base;

    // 마이그레이션을 거치지 않고 들어온 데이터(직접 만든 백업 등)를 위한 안전망.
    base.profile = upgradeProfileGoals(state.profile) || null;
    base.targets = state.targets || null;
    base.supplements = Array.isArray(state.supplements) ? state.supplements : [];
    base.bodyLogs = Array.isArray(state.bodyLogs) ? state.bodyLogs : [];
    base.customFoods = Array.isArray(state.customFoods) ? state.customFoods : [];
    // favorites 는 나중에 추가된 필드다. 값을 바꾸는 게 아니라 빈 배열을 채우기만 하면 되므로
    // 스키마 버전을 올리지 않고 여기서 정규화한다. (goals 처럼 기존 값을 '변환'해야 할 때만 마이그레이션)
    base.favorites = Array.isArray(state.favorites) ? state.favorites : [];

    var meta = state.meta && typeof state.meta === 'object' ? state.meta : {};
    base.meta = { lastBackupAt: meta.lastBackupAt || null };

    base.dailyLogs = {};
    if (state.dailyLogs && typeof state.dailyLogs === 'object') {
      Object.keys(state.dailyLogs).forEach(function (key) {
        var src = state.dailyLogs[key] || {};
        var day = emptyDay();
        day.meals = Array.isArray(src.meals) ? src.meals : [];
        day.alcohol = normalizeAlcohol(src.alcohol);
        day.supplementsTaken = Array.isArray(src.supplementsTaken) ? src.supplementsTaken : [];
        day.workouts = Array.isArray(src.workouts) ? src.workouts : [];
        day.waterMl = Number(src.waterMl) || 0;
        day.note = typeof src.note === 'string' ? src.note : '';
        base.dailyLogs[key] = day;
      });
    }

    return base;
  }

  /** 음주 기록 정규화. alcohol 필드는 나중에 추가된 항목이라 없는 날이 있을 수 있다. */
  function normalizeAlcohol(src) {
    var a = src && typeof src === 'object' ? src : {};
    return {
      drank: a.drank === true,
      kcal: Number(a.kcal) || 0,
      note: typeof a.note === 'string' ? a.note : ''
    };
  }

  /* ---------- 읽기 / 쓰기 ---------- */

  var cache = null;

  function load() {
    if (cache) return cache;
    var raw = null;
    try {
      var text = localStorage.getItem(STORAGE_KEY);
      raw = text ? JSON.parse(text) : null;
    } catch (e) {
      console.warn('[FitLog] 저장된 데이터를 읽지 못했습니다. 새로 시작합니다.', e);
      raw = null;
    }
    cache = migrate(raw);
    return cache;
  }

  function save(state) {
    cache = state || cache;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cache));
      return true;
    } catch (e) {
      console.error('[FitLog] 저장 실패', e);
      return false;
    }
  }

  /** 상태를 함수로 변경하고 저장. mutator 가 값을 반환하면 그 값을 새 상태로 쓴다. */
  function update(mutator) {
    var state = load();
    var next = mutator(state);
    save(next || state);
    return cache;
  }

  /** 저장된 데이터를 통째로 교체 (불러오기 / 초기화용) */
  function replace(raw) {
    cache = migrate(raw);
    save(cache);
    return cache;
  }

  function reset() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {
      console.warn('[FitLog] 초기화 실패', e);
    }
    cache = emptyState();
    return cache;
  }

  function hasProfile() {
    var p = load().profile;
    return !!(p && p.height && p.age && p.sex && p.weight);
  }

  /** 특정 날짜 로그를 가져온다. 없으면 빈 로그를 만들어 반환(저장은 하지 않음). */
  function getDay(dateKey) {
    var key = dateKey || todayKey();
    var state = load();
    return state.dailyLogs[key] || emptyDay();
  }

  /* ---------- 식사 기록 ---------- */

  var idSeq = 0;

  function newId(prefix) {
    idSeq += 1;
    return prefix + '_' + Date.now().toString(36) + '_' + idSeq;
  }

  /** 해당 날짜 로그를 꺼내온다. 없으면 만들어 붙인다. */
  function ensureDay(state, dateKey) {
    if (!state.dailyLogs[dateKey]) state.dailyLogs[dateKey] = emptyDay();
    return state.dailyLogs[dateKey];
  }

  /**
   * 끼니를 기록한다. nutrients 는 저장 시점 계산값을 그대로 넣는다 —
   * 나중에 음식 DB 값이 바뀌어도 과거 기록은 그대로 남아야 하기 때문.
   */
  function addMeal(dateKey, meal) {
    var key = dateKey || todayKey();
    var record = {
      id: meal.id || newId('meal'),
      type: meal.type || 'snack',
      sourceKind: meal.sourceKind || 'template',
      sourceId: meal.sourceId || null,
      label: meal.label || '',
      portion: Number(meal.portion) || 1,
      items: Array.isArray(meal.items) ? meal.items : null,
      nutrients: meal.nutrients || {},
      time: meal.time || '',
      note: meal.note || ''
    };

    update(function (state) {
      ensureDay(state, key).meals.push(record);
      return state;
    });

    return record;
  }

  function removeMeal(dateKey, mealId) {
    var key = dateKey || todayKey();
    update(function (state) {
      var day = state.dailyLogs[key];
      if (!day) return state;
      day.meals = day.meals.filter(function (m) { return m.id !== mealId; });
      return state;
    });
  }

  /** 하루치 식사 영양소 합계 */
  function dayNutrients(dateKey) {
    var day = getDay(dateKey);
    return FitLog.foods.sum(day.meals.map(function (m) { return m.nutrients; }));
  }

  /* ---------- 운동 기록 ---------- */

  function addWorkout(dateKey, workout) {
    var key = dateKey || todayKey();
    var record = {
      id: workout.id || newId('wk'),
      type: workout.type === 'cardio' ? 'cardio' : 'strength',
      minutes: Number(workout.minutes) || 0,
      bodyParts: Array.isArray(workout.bodyParts) ? workout.bodyParts : [],
      intensity: workout.intensity || null,
      note: workout.note || ''
    };

    update(function (state) {
      ensureDay(state, key).workouts.push(record);
      return state;
    });

    return record;
  }

  function removeWorkout(dateKey, workoutId) {
    var key = dateKey || todayKey();
    update(function (state) {
      var day = state.dailyLogs[key];
      if (!day) return state;
      day.workouts = day.workouts.filter(function (w) { return w.id !== workoutId; });
      return state;
    });
  }

  /* ---------- 인바디 측정 ---------- */

  /** 같은 날짜 기록이 있으면 덮어쓴다. 하루에 두 번 재도 마지막 값만 남기는 게 맞다. */
  function saveBodyLog(entry) {
    var record = {
      date: entry.date || todayKey(),
      weight: Number(entry.weight),
      skeletalMuscle: entry.skeletalMuscle === '' || entry.skeletalMuscle === null
        ? null : Number(entry.skeletalMuscle),
      bodyFatPct: entry.bodyFatPct === '' || entry.bodyFatPct === null
        ? null : Number(entry.bodyFatPct),
      visceralRatio: entry.visceralRatio === '' || entry.visceralRatio === null
        ? null : Number(entry.visceralRatio),
      waistCm: entry.waistCm === '' || entry.waistCm === null
        ? null : Number(entry.waistCm)
    };

    update(function (state) {
      state.bodyLogs = state.bodyLogs.filter(function (l) { return l.date !== record.date; });
      state.bodyLogs.push(record);
      state.bodyLogs.sort(function (a, b) { return a.date < b.date ? -1 : 1; });

      // 가장 최근 측정은 프로필 체중에도 반영한다. 목표치가 옛 체중에 묶이면 안 된다.
      var last = state.bodyLogs[state.bodyLogs.length - 1];
      if (state.profile && last && last.weight) {
        state.profile.weight = last.weight;
        if (last.bodyFatPct !== null) state.profile.bodyFatPct = last.bodyFatPct;
        if (last.skeletalMuscle !== null) state.profile.skeletalMuscle = last.skeletalMuscle;
        state.targets = FitLog.calc.computeTargets(state.profile);
      }
      return state;
    });

    return record;
  }

  function removeBodyLog(date) {
    update(function (state) {
      state.bodyLogs = state.bodyLogs.filter(function (l) { return l.date !== date; });
      return state;
    });
  }

  /* ---------- 보충제 ---------- */

  function addSupplement(sup) {
    var record = {
      id: sup.id || newId('sup'),
      name: sup.name || '',
      presetId: sup.presetId || null,
      timeSlot: sup.timeSlot || 'morning',
      dailyDoses: Number(sup.dailyDoses) || 1,
      nutrients: sup.nutrients || {},
      enabled: sup.enabled !== false
    };

    update(function (state) {
      state.supplements.push(record);
      return state;
    });

    return record;
  }

  function updateSupplement(id, patch) {
    update(function (state) {
      state.supplements.forEach(function (sup) {
        if (sup.id !== id) return;
        Object.keys(patch).forEach(function (k) { sup[k] = patch[k]; });
      });
      return state;
    });
  }

  function removeSupplement(id) {
    update(function (state) {
      state.supplements = state.supplements.filter(function (s) { return s.id !== id; });
      // 지난 기록의 체크 표시도 같이 정리한다. 안 그러면 없는 보충제를 먹은 걸로 남는다.
      Object.keys(state.dailyLogs).forEach(function (day) {
        var log = state.dailyLogs[day];
        log.supplementsTaken = log.supplementsTaken.filter(function (s) { return s !== id; });
      });
      return state;
    });
  }

  function isTaken(dateKey, supId) {
    return getDay(dateKey).supplementsTaken.indexOf(supId) >= 0;
  }

  /** 오늘 먹었는지 표시를 켜고 끈다. 반환값은 바뀐 뒤 상태. */
  function toggleTaken(dateKey, supId) {
    var key = dateKey || todayKey();
    var on = false;

    update(function (state) {
      var day = ensureDay(state, key);
      var at = day.supplementsTaken.indexOf(supId);
      if (at >= 0) day.supplementsTaken.splice(at, 1);
      else { day.supplementsTaken.push(supId); on = true; }
      return state;
    });

    return on;
  }

  /* ---------- 백업 이력 ----------
     localStorage 는 영구 저장이 아니다. iOS 는 한동안 안 쓴 사이트의 저장 데이터를
     지울 수 있고, 브라우저 기록을 지워도 같이 사라진다.
     유일한 확실한 대비가 백업이므로, 마지막으로 언제 백업했는지를 기록해 두고
     너무 오래됐으면 알려준다. */

  function markBackedUp(when) {
    var at = when || new Date().toISOString();
    update(function (state) {
      state.meta.lastBackupAt = at;
      return state;
    });
    return at;
  }

  /** 마지막 백업 이후 며칠 지났는지. 백업한 적이 없으면 null. */
  function daysSinceBackup() {
    var at = load().meta.lastBackupAt;
    if (!at) return null;

    var then = new Date(at).getTime();
    if (isNaN(then)) return null;

    return Math.floor((Date.now() - then) / 86400000);
  }

  /** 기록이 며칠치 쌓였는지 — 잃을 게 얼마나 되는지 판단하는 데 쓴다 */
  function recordedDayCount() {
    var logs = load().dailyLogs;
    return Object.keys(logs).filter(function (d) {
      var log = logs[d];
      return log.meals.length || log.workouts.length || log.supplementsTaken.length;
    }).length;
  }

  /* ---------- 즐겨찾기 ---------- */

  function favKey(kind, id) { return kind + ':' + id; }

  function isFavorite(kind, id) {
    return load().favorites.indexOf(favKey(kind, id)) >= 0;
  }

  /** 즐겨찾기를 켜고 끈다. 반환값은 바뀐 뒤 상태(true = 즐겨찾기됨). */
  function toggleFavorite(kind, id) {
    var key = favKey(kind, id);
    var on = false;

    update(function (state) {
      var at = state.favorites.indexOf(key);
      if (at >= 0) state.favorites.splice(at, 1);
      else { state.favorites.push(key); on = true; }
      return state;
    });

    return on;
  }

  /* ---------- 직접 등록한 음식 ---------- */

  /**
   * 사용자가 직접 등록한 음식. 100g이 아니라 '1회 먹는 양' 기준으로 저장한다.
   * 비개발자가 100g 환산을 하게 만들면 안 되기 때문.
   */
  function addCustomFood(input) {
    var food = {
      id: newId('custom'),
      name: String(input.name || '').trim(),
      nutrients: input.nutrients || {},
      createdAt: todayKey()
    };

    update(function (state) {
      state.customFoods.push(food);
      return state;
    });

    return food;
  }

  function getCustomFood(id) {
    var hits = load().customFoods.filter(function (f) { return f.id === id; });

  function microTargets(profile) {
    var sex = profile && profile.sex === 'male' ? 'male' : 'female';

  /* ---------- 조회 헬퍼 ---------- */

  var LIST = [];
  var BY_ID = {};

  function build() {
    LIST = [];
    BY_ID = {};

    Object.keys(RAW).forEach(function (group) {
      RAW[group].forEach(function (row) {
        var per100g = {};
        KEYS.forEach(function (key, i) { per100g[key] = row[2][i]; });

        var food = { id: row[0], name: row[1], group: group, per100g: per100g };
        LIST.push(food);
        BY_ID[food.id] = food;
      });
    });
  }

  function all() { return LIST; }

  function get(id) { return BY_ID[id] || null; }

  /** 이름 부분일치 검색. 짧은 이름이 먼저 오도록 정렬한다. */
  function search(query, limit) {
    var q = String(query || '').trim();
    if (!q) return [];

    var hits = LIST.filter(function (f) { return f.name.indexOf(q) >= 0; });

    hits.sort(function (a, b) {
      var ai = a.name.indexOf(q), bi = b.name.indexOf(q);
      if (ai !== bi) return ai - bi;                 // 앞에서 걸린 것 우선
      return a.name.length - b.name.length;         // 그다음 짧은 이름 우선
    });

    return limit ? hits.slice(0, limit) : hits;
  }

  /** 음식 g만큼의 영양소. 100g 기준값을 비례 배분한다. */
  function scale(idOrFood, grams) {
    var food = typeof idOrFood === 'string' ? get(idOrFood) : idOrFood;
    if (!food) return null;

    var ratio = (Number(grams) || 0) / 100;
    var out = {};
    KEYS.forEach(function (key) { out[key] = food.per100g[key] * ratio; });
    return out;
  }

  /** 이미 계산된 영양소 객체를 배수로 늘린다 (직접 등록한 음식의 양 조절용). */
  function scaleNutrients(nutrients, ratio) {
    var r = Number(ratio) || 0;
    var out = {};
    KEYS.forEach(function (key) { out[key] = (Number(nutrients[key]) || 0) * r; });
    return out;
  }

  /** 영양소 객체 여러 개를 더한다. */
  function sum(parts) {
    var total = {};
    KEYS.forEach(function (key) { total[key] = 0; });

    (parts || []).forEach(function (part) {
      if (!part) return;
      KEYS.forEach(function (key) { total[key] += Number(part[key]) || 0; });
    });

    return total;
  }

  /** 표시용 반올림. 칼로리는 정수, 나머지는 소수 1자리. */
  function round(nutrients) {
    var out = {};
    KEYS.forEach(function (key) {
      var v = Number(nutrients[key]) || 0;
      out[key] = key === 'kcal' ? Math.round(v) : Math.round(v * 10) / 10;
    });
    return out;
  }

  build();

  FitLog.foods = {
    KEYS: KEYS,
    GROUP_LABEL: GROUP_LABEL,
    all: all,
    get: get,
    search: search,
    scale: scale,
    scaleNutrients: scaleNutrients,
    sum: sum,
    round: round,
    _raw: RAW
  };
})(window.FitLog);

  /* ---------- 조회·계산 ---------- */

  var LIST = [];
  var BY_ID = {};

  function build() {
    LIST = [];
    BY_ID = {};

    Object.keys(RAW).forEach(function (category) {
      RAW[category].forEach(function (row) {
        var tpl = {
          id: row[0],
          name: row[1],
          category: category,
          baseServing: '1인분',
          items: row[2].map(function (pair) {
            return { food: pair[0], g: pair[1] };
          })
        };
        LIST.push(tpl);
        BY_ID[tpl.id] = tpl;
      });
    });
  }

  function all() { return LIST; }

  function get(id) { return BY_ID[id] || null; }

  function byCategory(category) {
    return LIST.filter(function (t) { return t.category === category; });
  }

  /**
   * 템플릿의 영양소. 재료를 portion 배수로 늘려 합산한다.
   * @param {object|string} idOrTemplate
   * @param {number} portion 적게 0.7 / 보통 1.0 / 많이 1.4
   */
  function nutrients(idOrTemplate, portion) {
    var tpl = typeof idOrTemplate === 'string' ? get(idOrTemplate) : idOrTemplate;
    if (!tpl) return null;

    var ratio = portion === undefined ? 1 : Number(portion);
    var parts = tpl.items.map(function (item) {
      return FitLog.foods.scale(item.food, item.g * ratio);
    });
    return FitLog.foods.sum(parts);
  }

  /** 재료를 '밥 (백미) 210g' 형태의 문자열 배열로 */
  function itemLabels(idOrTemplate, portion) {
    var tpl = typeof idOrTemplate === 'string' ? get(idOrTemplate) : idOrTemplate;
    if (!tpl) return [];

    var ratio = portion === undefined ? 1 : Number(portion);
    return tpl.items.map(function (item) {
      var food = FitLog.foods.get(item.food);
      return (food ? food.name : item.food) + ' ' + Math.round(item.g * ratio) + 'g';
    });
  }

  /** 이름 부분일치 검색. foods.search 와 같은 정렬 규칙. */
  function search(query, limit) {
    var q = String(query || '').trim();
    if (!q) return [];

    var hits = LIST.filter(function (t) { return t.name.indexOf(q) >= 0; });
    hits.sort(function (a, b) {
      var ai = a.name.indexOf(q), bi = b.name.indexOf(q);
      if (ai !== bi) return ai - bi;
      return a.name.length - b.name.length;
    });
    return limit ? hits.slice(0, limit) : hits;
  }

  build();

  FitLog.templates = {
    PORTIONS: PORTIONS,
    CATEGORY_LABEL: CATEGORY_LABEL,
    all: all,
    get: get,
    byCategory: byCategory,
    nutrients: nutrients,
    itemLabels: itemLabels,
    search: search
  };
})(window.FitLog);

      var total = sources.reduce(function (sum, s) {

      }, 0);

      var rounded = Math.round(total * 10) / 10;

      var msg = sources.map(function (s) { return s.name; }).join(', ') +

          Math.round((total / target) * 10) / 10 + '배';
      }

      if (n.ul && n.ulSource === 'supplement' && total > n.ul) {
        msg += '. 상한섭취량(' + n.ul + n.unit + ')을 넘었어 — 제품 함량 확인해 봐.';

      } else if (n.ul) {
        msg += '. 상한 ' + n.ul + n.unit + ' 아래야.';
      } else {
        msg += '.';
      }

      out.push({
        key: n.key,
        name: n.name,
        unit: n.unit,
        total: rounded,
        target: target || null,
        sources: sources.map(function (s) { return s.name; }),
        message: msg
      });
    });

    return out;
  }

      var fromFood = Number(food[n.key]) || 0;
      var fromSupp = Number(supp[n.key]) || 0;
      var checked = n.ulSource === 'supplement' ? fromSupp : fromFood + fromSupp;
      if (checked <= n.ul) return;

      var isGoal = n.ulKind === 'goal';
      var limitName = isGoal ? '목표섭취량' : '상한섭취량';
      var rounded = Math.round(checked * 10) / 10;

      out.push({
        key: n.key,
        name: n.name,
        unit: n.unit,
        value: rounded,
        ul: n.ul,
        source: n.ulSource,
        message: n.name + ' 섭취량이 ' + limitName + '(' + n.ul + n.unit + ')을 넘었어. ' +
          (n.ulSource === 'supplement'
            ? '보충제에서만 ' + rounded + n.unit + '이야. 제품 함량 확인해 보고, '
            : '오늘 합계가 ' + rounded + n.unit + '이야. ') +
          (isGoal ? '짠 음식을 조금 줄여 보는 게 좋아.'
                  : '계속 이 수준이면 전문가랑 상의해 봐.')
      });
    });

  }

  function bySlot(supplements) {

   */
  function interactions(supplements) {
    var slots = bySlot(supplements);
    var out = [];

    TIME_SLOTS.forEach(function (slot) {
      var here = slots[slot.key];
      if (!here.length) return;

      var irons = here.filter(function (s) { return hasTag(s, 'iron'); });
      var blockers = here.filter(function (s) { return hasTag(s, 'ironBlocker'); });
      var helpers = here.filter(function (s) { return hasTag(s, 'ironHelper'); });

      if (irons.length && blockers.length) {
        out.push({
          level: 'warn',
          message: slot.label + ' — ' + names(irons) + ' + ' + names(blockers) +

        });
      }

      if (irons.length && helpers.length) {
        out.push({
          level: 'good',
          message: slot.label + ' — ' + names(irons) + ' + ' + names(helpers) +
            ' 조합 좋아. 비타민 C가 철분 흡수를 도와줘.'
        });
      }

      // 좋은 조합: 비타민 D + K2
      var hasD = here.some(function (s) { return s.presetId === 'vitamin_d'; });
      var hasK2 = here.some(function (s) { return s.presetId === 'vitamin_k2'; });
      if (hasD && hasK2) {
        out.push({
          level: 'good',
          message: slot.label + ' — 비타민 D + K2 같이 뒀네. 칼슘 대사에 서로 도움이 돼.'
        });
      }

      var fatSoluble = here.filter(function (s) { return hasTag(s, 'fatSoluble'); });

      // 시간대 권고: 지용성이 공복에 있으면 식후로
      if (fatSoluble.length && slot.fasting) {
        out.push({
          level: 'tip',
          message: names(fatSoluble) + ' — 지용성이라 공복엔 잘 흡수되지 않아. ' +
            '점심이나 저녁 식후로 옮기는 게 좋아.'
        });
      }

      // 좋은 조합: 지용성 + 식사
      if (fatSoluble.length && slot.withMeal) {
        out.push({
          level: 'good',
          message: names(fatSoluble) + ' — ' + slot.label + ' 식사와 같이 둔 건 잘한 배치야. ' +
            '지방과 같이 먹어야 흡수돼.'
        });
      }

      // 시간대 권고: 졸음 유발 성분이 아침에 있으면 취침 전으로
      var sedatives = here.filter(function (s) { return hasTag(s, 'sedative'); });
      if (sedatives.length && (slot.key === 'morning' || slot.key === 'lunch')) {
        out.push({
          level: 'tip',
          message: names(sedatives) + ' — 졸릴 수 있어. 취침 전으로 옮기면 수면에도 도움이 돼.'
        });
      }
    });

    return out;
  }

  /** 오늘 화면에 띄울 것 전부를 한 번에 계산한다. */
  function review(supplements, foodNutrients, microTargets) {
    var supp = dailyNutrients(supplements);
    return {
      nutrients: supp,
      duplicates: duplicates(supplements, microTargets),
      ul: ulWarnings(foodNutrients, supp),
      interactions: interactions(supplements)
    };
  }

  FitLog.supplements = {
    TIME_SLOTS: TIME_SLOTS,
    SLOT_BY_KEY: SLOT_BY_KEY,
    isPassed: isPassed,
    PRESET_GROUPS: PRESET_GROUPS,
    PRESETS: PRESETS,
    nutrientFields: nutrientFields,
    fieldMeta: fieldMeta,
    getPreset: getPreset,
    fromPreset: fromPreset,
    tagsOf: tagsOf,
    dailyNutrients: dailyNutrients,
    duplicates: duplicates,
    ulWarnings: ulWarnings,
    interactions: interactions,
    bySlot: bySlot,
    review: review
  };
})(window.FitLog);

</script>
<script>
/* judge.js — 판정 엔진 (영양 4단계 · 운동 · 신체 변화)
 *
 * 순수 계산만 한다. DOM 을 건드리지 않으므로 콘솔에서 단독 검증할 수 있다.
 *
 * 일간 수치는 하루하루 편차가 커서 그대로 보면 오해를 부른다.
 * 그래서 메인 리포트는 전부 '주간 평균' 기준이다.
 */

window.FitLog = window.FitLog || {};

(function (FitLog) {
  'use strict';

  /* ---------- 영양 4단계 ---------- */

  var LEVELS = {
    low:    { key: 'low',    label: '부족',      mark: '🔴', rank: 0 },
    midLow: { key: 'midLow', label: '약간 부족',  mark: '🟡', rank: 1 },
    ok:     { key: 'ok',     label: '적정',      mark: '🟢', rank: 2 },
    over:   { key: 'over',   label: '과다',      mark: '🟠', rank: 3 }
  };

  /**
   * 섭취량을 4단계로 나눈다.
   *
   * 미량영양소와 매크로는 '과다' 의 뜻이 다르다:
   *   - 미량영양소는 권장량을 좀 넘어도 문제가 아니고, 진짜 경계선은 상한섭취량(UL)이다.
   *     110~UL 구간을 과다로 부르면 매일 거짓 경고가 뜬다. → ul 로 판정한다.
   *   - 매크로(칼로리·지방 등)는 UL 이라는 개념이 없고 초과 자체가 문제다. → overRatio 로 판정한다.
   *
   * 또 하나: 부족 판정과 상한 판정은 서로 다른 값을 본다.
   * 마그네슘·비타민E·엽산은 상한을 보충제 유래분으로만 따지지만,
   * 부족한지는 음식까지 합친 총량으로 봐야 한다. 그래서 ulValue 를 따로 받는다.
   *
   * @param {number} value 총 섭취량 (부족 판정에 쓴다)
   * @param {number} target 권장량
   * @param {{ul?:number, ulValue?:number, overRatio?:number}} opts
   */
  function levelOf(value, target, opts) {
    var o = opts || {};
    var v = Number(value) || 0;
    var t = Number(target) || 0;

    var ulValue = o.ulValue === undefined || o.ulValue === null ? v : Number(o.ulValue);
    if (o.ul && ulValue > o.ul) return LEVELS.over;

    if (!t) return LEVELS.ok;

    var ratio = v / t;
    if (ratio < 0.7) return LEVELS.low;
    if (ratio < 0.9) return LEVELS.midLow;
    if (o.overRatio && ratio > o.overRatio) return LEVELS.over;
    return LEVELS.ok;
  }

  // 매크로에서 이 배수를 넘으면 과다로 본다 (스펙의 '적정 90~110%').
  var MACRO_OVER = 1.1;

  /* ---------- 날짜 유틸 ---------- */

  function shiftDays(dateKey, delta) {
    var parts = dateKey.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    d.setDate(d.getDate() + delta);
    return FitLog.store.todayKey(d);
  }

  /** endDateKey 를 마지막 날로 하는 연속 날짜 목록 (과거 → 최근) */
  function lastDays(endDateKey, count) {
    var out = [];
    for (var i = count - 1; i >= 0; i--) out.push(shiftDays(endDateKey, -i));
    return out;
  }

  /* ---------- 주간 영양 리포트 ---------- */

  /**
   * 기록이 있는 날만 평균을 낸다.
   * 기록이 없는 날은 '안 먹은 날' 이 아니라 '안 적은 날' 이라서,
   * 0 으로 넣고 평균을 내면 실제보다 훨씬 부족하게 나온다.
   */
  function nutritionReport(state, endDateKey, dayCount) {
    var days = lastDays(endDateKey || FitLog.store.todayKey(), dayCount || 7);
    var targets = state.targets;
    var supp = FitLog.supplements.dailyNutrients(state.supplements);

    var logged = [];
    days.forEach(function (key) {
      var log = state.dailyLogs[key];
      if (log && log.meals.length) logged.push(key);
    });

    if (!logged.length) {
      return { days: days, loggedDays: 0, items: [], macros: [], avg: null };
    }

    // 하루치 합계를 모아 평균낸다. 보충제는 매일 먹는 전제라 하루분을 그대로 더한다.
    var sums = FitLog.foods.sum(logged.map(function (key) {
      return FitLog.foods.sum(state.dailyLogs[key].meals.map(function (m) {
        return m.nutrients;
      }));
    }));

    var avg = {};
    Object.keys(sums).forEach(function (k) { avg[k] = sums[k] / logged.length; });

    // 단백질은 보충제(유청·콜라겐)에서도 오므로 매크로에 더해 준다.
    var avgWithSupp = {};
    Object.keys(avg).forEach(function (k) {
      avgWithSupp[k] = avg[k] + (Number(supp[k]) || 0);
    });
    avgWithSupp.protein = avg.protein + (Number(supp.protein) || 0);

    var macros = [
      { key: 'kcal', name: '칼로리', unit: 'kcal', value: avgWithSupp.kcal, target: targets.calories },
      { key: 'protein', name: '단백질', unit: 'g', value: avgWithSupp.protein, target: targets.protein },
      { key: 'carbs', name: '탄수화물', unit: 'g', value: avgWithSupp.carbs, target: targets.carbs },
      { key: 'fat', name: '지방', unit: 'g', value: avgWithSupp.fat, target: targets.fat },
      { key: 'fiber', name: '식이섬유', unit: 'g', value: avgWithSupp.fiber, target: targets.fiber }
    ].map(function (m) {
      m.value = Math.round(m.value * 10) / 10;
      m.ratio = m.target ? m.value / m.target : 0;
      m.level = levelOf(m.value, m.target, { overRatio: MACRO_OVER });
      return m;
    });

    var items = FitLog.nutrition.NUTRIENTS.map(function (n) {
      // 마그네슘·비타민E·엽산은 UL 을 보충제 유래분으로만 따진다.
      var forUL = n.ulSource === 'supplement' ? (Number(supp[n.key]) || 0) : avgWithSupp[n.key];
      var target = targets.micros[n.key];
      var value = Math.round(avgWithSupp[n.key] * 10) / 10;

      return {
        key: n.key,
        name: n.name,
        unit: n.unit,
        value: value,
        target: target,
        ratio: target ? value / target : 0,
        // 부족 판정은 총량으로, 상한 판정은 forUL 로 — 둘은 다른 값이다.
        level: levelOf(value, target, { ul: n.ul, ulValue: forUL }),
        fromSupplement: Math.round((Number(supp[n.key]) || 0) * 10) / 10
      };
    });

    return { days: days, loggedDays: logged.length, avg: avgWithSupp, macros: macros, items: items };
  }

  /**
   * 우선순위 정렬: 단백질 → 식이섬유 → 부족한 미량영양소 → 과다.
   * 리포트에서 '먼저 봐야 할 것' 순서다.
   */
  function priority(report) {
    var out = [];
    if (!report.macros.length) return out;

    function macro(key) {
      return report.macros.filter(function (m) { return m.key === key; })[0];
    }

    var protein = macro('protein');
    if (protein && protein.level.rank < LEVELS.ok.rank) out.push(protein);

    var fiber = macro('fiber');
    if (fiber && fiber.level.rank < LEVELS.ok.rank) out.push(fiber);

    report.items.forEach(function (item) {
      if (item.level.key === 'low') out.push(item);
    });
    report.items.forEach(function (item) {
      if (item.level.key === 'over') out.push(item);
    });

    return out;
  }

  /**
   * 오늘 하루치 리포트.
   *
   * 주간 평균은 '요즘 어떤가' 를 보는 것이고, 오늘 화면에서 알고 싶은 건
   * '지금 뭐가 모자라고 뭐가 넘쳤나' 다. 그래서 오늘 카드는 이 함수를 쓴다.
   * 보충제는 매일 먹는 전제라 식사 기록이 없어도 합산에 들어간다.
   */
  function todayReport(state, dateKey) {
    var key = dateKey || FitLog.store.todayKey();
    var day = FitLog.store.getDay(key);
    var targets = state.targets;

    var food = FitLog.foods.sum(day.meals.map(function (m) { return m.nutrients; }));
    var supp = FitLog.supplements.dailyNutrients(state.supplements);

    var total = {};
    FitLog.foods.KEYS.forEach(function (k) {
      total[k] = (Number(food[k]) || 0) + (Number(supp[k]) || 0);
    });
    total.protein = (Number(food.protein) || 0) + (Number(supp.protein) || 0);

    var macros = [
      { key: 'kcal', name: '칼로리', unit: 'kcal', target: targets.calories },
      { key: 'protein', name: '단백질', unit: 'g', target: targets.protein },
      { key: 'carbs', name: '탄수화물', unit: 'g', target: targets.carbs },
      { key: 'fat', name: '지방', unit: 'g', target: targets.fat },
      { key: 'fiber', name: '식이섬유', unit: 'g', target: targets.fiber }
    ].map(function (m) {
      m.value = Math.round((total[m.key] || 0) * 10) / 10;
      m.ratio = m.target ? m.value / m.target : 0;
      m.level = levelOf(m.value, m.target, { overRatio: MACRO_OVER });
      return m;
    });

    var items = FitLog.nutrition.NUTRIENTS.map(function (n) {
      var forUL = n.ulSource === 'supplement' ? (Number(supp[n.key]) || 0) : total[n.key];
      var target = targets.micros[n.key];
      var value = Math.round((total[n.key] || 0) * 10) / 10;

      return {
        key: n.key,
        name: n.name,
        unit: n.unit,
        value: value,
        target: target,
        ratio: target ? value / target : 0,
        ul: n.ul,
        ulKind: n.ulKind || null,
        level: levelOf(value, target, { ul: n.ul, ulValue: forUL }),
        fromFood: Math.round((Number(food[n.key]) || 0) * 10) / 10,
        fromSupplement: Math.round((Number(supp[n.key]) || 0) * 10) / 10
      };
    });

    return { date: key, hasMeals: day.meals.length > 0, macros: macros, items: items };
  }

  /**
   * 영양소 한 항목을 '지금 얼마나 먹었고 하루 필요량 대비 어떤지' 한 문장으로.
   * 이름 뒤에 조사를 붙이지 않는다 — '비타민 D' 처럼 영문으로 끝나는 이름이 많다.
   */
  function itemMessage(item) {
    var pct = Math.round(item.ratio * 100);
    var head = item.name + ' — 오늘 ' + item.value + item.unit + ', 하루 필요량(' +
      item.target + item.unit + ')의 ' + pct + '%';

    if (item.level.key === 'over') {
      var limitName = item.ulKind === 'goal' ? '목표섭취량' : '상한섭취량';
      return head + '. ' + limitName + '(' + item.ul + item.unit + ')을 넘었어. ' +
        (item.ulKind === 'goal'
          ? '짠 음식을 줄이는 게 좋아.'
          : '제품 함량 확인해 보고, 계속 이 수준이면 전문가랑 상의해 봐.');
    }

    if (item.ratio > 1 && item.ul) {
      return head + '야. 상한(' + item.ul + item.unit + ') 아래라 당장 문제는 아니야.';
    }
    if (item.ratio > 1) return head + '야.';

    var short = Math.round((item.target - item.value) * 10) / 10;
    return head + '. ' + short + item.unit + ' 모자라.';
  }

  /* ---------- 주간 운동 집계 ---------- */

  function workoutSummary(state, endDateKey, dayCount) {
    var days = lastDays(endDateKey || FitLog.store.todayKey(), dayCount || 7);
    var plan = state.profile.weeklyPlan;
    var strength = 0, cardio = 0, minutes = 0;
    var bodyParts = {};
    var activeDays = {};

    days.forEach(function (key) {
      var log = state.dailyLogs[key];
      if (!log) return;
      log.workouts.forEach(function (w) {
        if (w.type === 'strength') strength += 1; else cardio += 1;
        minutes += Number(w.minutes) || 0;
        activeDays[key] = true;
        (w.bodyParts || []).forEach(function (p) { bodyParts[p] = true; });
      });
    });

    return {
      days: days,
      strength: strength,
      cardio: cardio,
      minutes: minutes,
      planStrength: plan.strength,
      planCardio: plan.cardio,
      bodyParts: Object.keys(bodyParts),
      activeDays: Object.keys(activeDays).length
    };
  }

  /** 오늘 기준 연속 휴식 일수 (오늘 포함하지 않고 어제부터 센다) */
  function restStreak(state, endDateKey) {
    var streak = 0;
    for (var i = 1; i <= 30; i++) {
      var key = shiftDays(endDateKey, -i);
      var log = state.dailyLogs[key];
      if (log && log.workouts.length) break;
      streak += 1;
    }
    return streak;
  }

  var BODY_PARTS = [
    { key: 'upper', label: '상체' },
    { key: 'lower', label: '하체' },
    { key: 'core',  label: '코어' },
    { key: 'back',  label: '등' }
  ];

  /* ---------- 운동 판정 ----------
   *
   * 처음엔 6종이었는데 4종을 걷어냈다. 사용자 요청:
   * "운동에 대해 독려하는 내용은 빼줘. 필요한 정보만 받고 싶어."
   *
   * 뺀 것 — '근력운동 N회 남았어'(잔소리), '하체·코어가 빠져 있어'(잔소리),
   *         'N일째 운동 기록이 없네'(잔소리), '계획 다 채웠어'(칭찬).
   *   계획 대비 횟수는 주간 탭에 '근력 1/3회' 라는 숫자로 이미 있다. 문장으로 또 말할 이유가 없다.
   *
   * 남긴 것 — 둘 다 '모르면 손해 보는 사실' 이다:
   *   1) 감량 중 근력운동 0회 → 빠지는 무게에 근육이 섞인다
   *   2) 근력운동 한 날 단백질 부족 → 그날 운동이 근성장으로 안 이어진다
   */

  function workoutJudgments(state, endDateKey) {
    var today = endDateKey || FitLog.store.todayKey();
    var week = workoutSummary(state, today, 7);
    var goals = FitLog.calc.normalizeGoals(state.profile.goals);
    var out = [];

    if (goals.indexOf('loseFat') >= 0 && week.strength === 0) {
      out.push({
        level: 'warn',
        message: '이번 주 근력운동이 0회야. 체중을 줄이는 중에 근력운동이 없으면 ' +
          '빠지는 무게에 근육이 섞여.'
      });
    }

    var shortDays = [];
    week.days.forEach(function (key) {
      var log = state.dailyLogs[key];
      if (!log || !log.meals.length) return;
      if (!log.workouts.some(function (w) { return w.type === 'strength'; })) return;

      var eaten = FitLog.foods.sum(log.meals.map(function (m) { return m.nutrients; }));
      if (eaten.protein < state.targets.protein * 0.8) shortDays.push(key);
    });
    if (shortDays.length) {
      out.push({
        level: 'warn',
        message: '근력운동 한 날 단백질이 부족했어 (' + shortDays.length + '일). ' +
          '운동한 날 단백질이 모자라면 근성장에 손해야.'
      });
    }

    return out;
  }

  /* ---------- 신체 변화 판정 ---------- */

  function sortedBodyLogs(state) {
    return state.bodyLogs.slice().sort(function (a, b) {
      return a.date < b.date ? -1 : 1;
    });
  }

  function bodyJudgments(state, endDateKey) {
    var today = endDateKey || FitLog.store.todayKey();
    var logs = sortedBodyLogs(state).filter(function (l) { return l.date <= today; });
    var out = [];
    if (logs.length < 2) return out;

    var latest = logs[logs.length - 1];

    // 최근 7일 안의 이전 측정과 비교해 감량 속도를 본다
    var weekAgo = shiftDays(today, -7);
    var prior = logs.filter(function (l) { return l.date <= latest.date && l.date >= weekAgo; });
    if (prior.length >= 2) {
      var first = prior[0];
      var drop = first.weight - latest.weight;
      if (drop > first.weight * 0.01) {
        out.push({
          level: 'warn',
          message: '한 주에 ' + (Math.round(drop * 10) / 10) + 'kg 빠졌어. ' +
            '몸무게의 1%를 넘는 속도라 근육까지 빠질 수 있어. 조금 천천히 가자.'
        });
      }
    }

    // 4주간 체중 변화가 거의 없는데 근력운동은 계속한 경우
    var fourWeekAgo = shiftDays(today, -28);
    var older = logs.filter(function (l) { return l.date <= fourWeekAgo; });
    if (older.length) {
      var past = older[older.length - 1];
      var diff = Math.abs(latest.weight - past.weight);
      var kept = workoutSummary(state, today, 28).strength >= 4;

      if (diff < past.weight * 0.01 && kept) {
        out.push({
          level: 'tip',
          message: '4주째 몸무게는 거의 그대로야. 근력운동을 계속했으니 ' +
            '저울은 그대로여도 체성분이 바뀌는 중일 수 있어. 허리둘레를 확인해 봐.'
        });
      }
    }

    // 골격근량이 늘고 체지방률이 줄었으면 칭찬
    var withBody = logs.filter(function (l) {
      return l.skeletalMuscle !== null && l.bodyFatPct !== null;
    });
    if (withBody.length >= 2) {
      var a = withBody[0], b = withBody[withBody.length - 1];
      if (b.skeletalMuscle > a.skeletalMuscle && b.bodyFatPct < a.bodyFatPct) {
        out.push({
          level: 'good',
          message: '골격근량은 늘고 체지방률은 줄었어 (' +
            a.skeletalMuscle + '→' + b.skeletalMuscle + 'kg, ' +
            a.bodyFatPct + '→' + b.bodyFatPct + '%). 잘 가고 있어.'
        });
      }
    }

    return out;
  }

  FitLog.judge = {
    LEVELS: LEVELS,
    BODY_PARTS: BODY_PARTS,
    levelOf: levelOf,
    shiftDays: shiftDays,
    lastDays: lastDays,
    nutritionReport: nutritionReport,
    todayReport: todayReport,
    itemMessage: itemMessage,
    priority: priority,
    workoutSummary: workoutSummary,
    restStreak: restStreak,
    workoutJudgments: workoutJudgments,
    bodyJudgments: bodyJudgments
  };
})(window.FitLog);

</script>
<script>
/* calc.js — BMR / TDEE / 목표치 계산
 *
 * 순수 함수만 둔다. DOM·localStorage 를 건드리지 않으므로 콘솔에서 단독 검증 가능.
 */

window.FitLog = window.FitLog || {};

(function (FitLog) {
  'use strict';

  /* 목표는 복수 선택이다. '현재 유지'만 단독 선택. */
  var GOAL_OPTIONS = [
    { value: 'gainStrength', label: '근력 강화' },
    { value: 'loseFat',      label: '체중 감량' },
    { value: 'maintain',     label: '현재 유지' }
  ];

  var GOAL_ORDER = ['gainStrength', 'loseFat', 'maintain'];

  /* 조합별 칼로리·단백질 규칙. 키는 정규화된 목표 배열을 '+' 로 이은 값. */
  var GOAL_RULES = {
    'gainStrength': {
      label: '근력 강화', kcalDelta: +100, proteinPerKg: 1.8, proteinRange: [1.6, 2.0]
    },
    'loseFat': {
      label: '체중 감량', kcalDelta: -300, proteinPerKg: 2.0, proteinRange: [1.8, 2.2]
    },
    'maintain': {
      label: '현재 유지', kcalDelta: 0, proteinPerKg: 1.4, proteinRange: [1.2, 1.6]
    },
    // 리컴프: 칼로리는 살짝만 줄이고 단백질을 최대로 올려 근육을 지키면서 체지방을 뺀다.
    'gainStrength+loseFat': {
      label: '근력 강화 + 체중 감량', kcalDelta: -200, proteinPerKg: 2.2, proteinRange: [2.0, 2.4],
      note: '근력 강화랑 체중 감량을 같이 골랐네. 칼로리는 조금만 줄이고 단백질을 높게 잡았어. ' +
            '체중은 천천히 빠지지만 근육은 지키는 방향이야.'
    }
  };

  /** 목표 배열 정규화 — 옛 단일 문자열도 받아준다. 항상 최소 1개를 보장. */
  function normalizeGoals(goals) {
    var list = Array.isArray(goals) ? goals : (goals ? [goals] : []);

    var seen = {};
    list = list.filter(function (g) {
      if (GOAL_ORDER.indexOf(g) < 0 || seen[g]) return false;
      seen[g] = true;
      return true;
    });

    // '현재 유지'는 다른 목표와 같이 갈 수 없다.
    if (list.length > 1) list = list.filter(function (g) { return g !== 'maintain'; });
    if (!list.length) list = ['maintain'];

    return list.sort(function (a, b) {
      return GOAL_ORDER.indexOf(a) - GOAL_ORDER.indexOf(b);
    });
  }

  /** 칩 토글용. 마지막 하나는 해제되지 않는다(목표 없는 상태 방지). */
  function toggleGoal(goals, value) {
    var list = normalizeGoals(goals);
    var at = list.indexOf(value);

    if (at >= 0) {
      if (list.length === 1) return list;
      list = list.slice();
      list.splice(at, 1);
    } else if (value === 'maintain') {
      list = ['maintain'];
    } else {
      list = list.concat(value);
    }
    return normalizeGoals(list);
  }

  /** 정규화된 목표 배열 → 적용할 규칙 */
  function goalRule(goals) {
    var list = normalizeGoals(goals);
    return GOAL_RULES[list.join('+')] || GOAL_RULES.maintain;
  }

  var PROTEIN_CAP_PER_KG = 2.5;   // 단백질 상한
  var CALORIE_FLOOR_RATIO = 1.05; // 목표 칼로리 하한 = BMR × 1.05
  var FAT_RATIO = 0.25;           // 총칼로리 중 지방 비율

  function round(n, digits) {
    var f = Math.pow(10, digits || 0);
    return Math.round(n * f) / f;
  }

  /**
   * 기초대사량.
   * 체지방률이 있으면 Katch-McArdle(제지방량 기반, 더 정확),
   * 없으면 Mifflin-St Jeor.
   */
  function bmr(profile) {
    var weight = Number(profile.weight);
    var height = Number(profile.height);
    var age = Number(profile.age);
    var bf = profile.bodyFatPct;

    if (bf !== null && bf !== undefined && bf !== '' && Number(bf) > 0) {
      var lbm = weight * (1 - Number(bf) / 100);
      return 370 + 21.6 * lbm;
    }

    var base = 10 * weight + 6.25 * height - 5 * age;
    return profile.sex === 'male' ? base + 5 : base - 161;
  }

  /** 주간 운동 횟수(근력+유산소) → 활동계수 */
  function activityFactor(weeklyPlan) {
    var plan = weeklyPlan || {};
    var sessions = (Number(plan.strength) || 0) + (Number(plan.cardio) || 0);
    if (sessions <= 1) return 1.20;
    if (sessions <= 3) return 1.375;
    if (sessions <= 5) return 1.45;
    return 1.55;
  }

  /** 총소비열량 */
  function tdee(profile) {
    return bmr(profile) * activityFactor(profile.weeklyPlan);
  }

  /**
   * 프로필 → 목표치 전체.
   * 반환값의 notes 는 사용자에게 보여줄 안내 문구 배열(안전장치가 작동한 이유 설명).
   */
  function computeTargets(profile) {
    var goals = normalizeGoals(profile.goals || profile.goal);
    var goal = goalRule(goals);
    var weight = Number(profile.weight);

    var bmrVal = bmr(profile);
    var tdeeVal = bmrVal * activityFactor(profile.weeklyPlan);
    var notes = [];

    if (goal.note) notes.push(goal.note);

    // --- 칼로리 (하한 안전장치) ---
    var calories = tdeeVal + goal.kcalDelta;
    var floor = bmrVal * CALORIE_FLOOR_RATIO;
    if (calories < floor) {
      calories = floor;
      notes.push('목표 칼로리가 기초대사량에 너무 가까워서 ' + Math.round(floor) +
                 'kcal로 올렸어. 이보다 적게 먹으면 근육이 빠지고 대사도 떨어져.');
    }
    calories = Math.round(calories);

    // --- 단백질 (상한 캡) ---
    var protein = weight * goal.proteinPerKg;
    var proteinCap = weight * PROTEIN_CAP_PER_KG;
    if (protein > proteinCap) {
      protein = proteinCap;
      notes.push('단백질 목표는 체중 1kg당 ' + PROTEIN_CAP_PER_KG + 'g까지만 잡았어.');
    }
    protein = Math.round(protein);

    // --- 나머지 매크로 ---
    var fat = Math.round(calories * FAT_RATIO / 9);
    var carbs = Math.round((calories - protein * 4 - fat * 9) / 4);
    if (carbs < 0) {
      carbs = 0;
      notes.push('지금 칼로리로는 단백질·지방 목표를 채우면 탄수화물 여유가 없어. ' +
                 '목표나 활동량을 다시 확인해 봐.');
    }

    var fiber = Math.max(20, Math.round(calories / 1000 * 14));

    return {
      calories: calories,
      protein: protein,
      carbs: carbs,
      fat: fat,
      fiber: fiber,
      micros: FitLog.nutrition.microTargets(profile),
      meta: {
        bmr: Math.round(bmrVal),
        tdee: Math.round(tdeeVal),
        bmrMethod: (profile.bodyFatPct > 0) ? 'Katch-McArdle' : 'Mifflin-St Jeor',
        activityFactor: activityFactor(profile.weeklyPlan),
        goals: goals,
        goalKey: goals.join('+'),
        goalLabel: goal.label,
        proteinRange: goal.proteinRange,
        computedAt: new Date().toISOString()
      },
      notes: notes
    };
  }

  /** 프로필 입력 검증. 반환값은 필드별 에러 메시지 맵(비어 있으면 통과). */
  function validateProfile(p) {
    var errors = {};
    var h = Number(p.height), a = Number(p.age), w = Number(p.weight);

    if (!h || h < 100 || h > 230) errors.height = '키는 100~230cm 사이로 입력해.';
    if (!a || a < 19 || a > 100) errors.age = '나이는 19~100세 사이로 입력해.';
    if (p.sex !== 'female' && p.sex !== 'male') errors.sex = '성별을 골라줘.';
    if (!w || w < 30 || w > 250) errors.weight = '체중은 30~250kg 사이로 입력해.';

    var goals = Array.isArray(p.goals) ? p.goals : (p.goal ? [p.goal] : []);
    if (!goals.filter(function (g) { return GOAL_ORDER.indexOf(g) >= 0; }).length) {
      errors.goals = '목표를 하나 이상 골라줘.';
    }

    if (p.bodyFatPct !== null && p.bodyFatPct !== undefined && p.bodyFatPct !== '') {
      var bf = Number(p.bodyFatPct);
      if (isNaN(bf) || bf < 3 || bf > 70) errors.bodyFatPct = '체지방률은 3~70% 사이로 입력해.';
    }
    if (p.skeletalMuscle !== null && p.skeletalMuscle !== undefined && p.skeletalMuscle !== '') {
      var sm = Number(p.skeletalMuscle);
      if (isNaN(sm) || sm < 5 || sm > 80) errors.skeletalMuscle = '골격근량은 5~80kg 사이로 입력해.';
      else if (w && sm >= w) errors.skeletalMuscle = '골격근량이 체중보다 클 순 없어.';
    }

    return errors;
  }

  FitLog.calc = {
    GOAL_OPTIONS: GOAL_OPTIONS,
    GOAL_RULES: GOAL_RULES,
    PROTEIN_CAP_PER_KG: PROTEIN_CAP_PER_KG,
    CALORIE_FLOOR_RATIO: CALORIE_FLOOR_RATIO,
    round: round,
    normalizeGoals: normalizeGoals,
    toggleGoal: toggleGoal,
    goalRule: goalRule,
    bmr: bmr,
    activityFactor: activityFactor,
    tdee: tdee,
    computeTargets: computeTargets,
    validateProfile: validateProfile
  };
})(window.FitLog);

</script>
<script>
/* backup.js — 데이터 내보내기 / 불러오기 (기기 변경 대비) */

window.FitLog = window.FitLog || {};

(function (FitLog) {
  'use strict';

  var store = FitLog.store;

  function fileName() {
    return 'fitlog-backup-' + store.todayKey() + '.json';
  }

  /** 현재 데이터를 JSON 파일로 다운로드 */
  function exportData() {
    // 내보낸 시각을 먼저 남긴다 — 그래야 백업 파일 안에도 '언제 백업한 것' 인지가 들어간다
    var at = store.markBackedUp();
    var payload = JSON.parse(JSON.stringify(store.load()));
    payload.exportedAt = at;

    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    return payload;
  }

  /**
   * 백업 파일 형식 검사. 잘못된 파일로 기존 데이터를 날리지 않도록 먼저 걸러낸다.
   * @returns {{ok:boolean, reason?:string}}
   */
  function validateBackup(data) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      return { ok: false, reason: 'FitLog 백업 파일이 아닌 것 같아.' };
    }
    if (!('schemaVersion' in data)) {
      return { ok: false, reason: 'FitLog 백업 파일이 아닌 것 같아. (형식 정보 없음)' };
    }
    if (Number(data.schemaVersion) > store.SCHEMA_VERSION) {
      return { ok: false, reason: '더 새 버전에서 만든 백업이야. 앱을 최신으로 업데이트하고 다시 해 봐.' };
    }
    if (data.profile && typeof data.profile !== 'object') {
      return { ok: false, reason: '백업 파일의 프로필 정보가 깨졌어.' };
    }
    return { ok: true };
  }

  /**
   * 파일을 읽어 데이터를 교체한다.
   * @param {File} file
   * @param {(err:Error|null, state?:object)=>void} done
   */
  function importFile(file, done) {
    if (!file) { done(new Error('파일을 골라줘.')); return; }

    var reader = new FileReader();
    reader.onerror = function () { done(new Error('파일을 읽지 못했어.')); };
    reader.onload = function () {
      var data;
      try {
        data = JSON.parse(String(reader.result));
      } catch (e) {
        done(new Error('JSON 형식이 아니야.'));
        return;
      }
      var check = validateBackup(data);
      if (!check.ok) { done(new Error(check.reason)); return; }

      var state = store.replace(data);
      done(null, state);
    };
    reader.readAsText(file, 'utf-8');
  }

  FitLog.backup = {
    fileName: fileName,
    exportData: exportData,
    validateBackup: validateBackup,
    importFile: importFile
  };
})(window.FitLog);

</script>
<script>
/* csv.js — 기록을 엑셀에서 열 수 있는 CSV 로 내보낸다
 *
 * JSON 백업과 용도가 다르다:
 *   - JSON: 기기를 바꿀 때 그대로 복원하기 위한 파일. 사람이 열어볼 것이 아니다.
 *   - CSV : 사람이 엑셀에서 보고, 트레이너에게 보내기 위한 표. 되돌릴 수는 없다.
 * 그래서 둘 중 하나를 없애지 않고 나란히 둔다.
 *
 * ⚠️ 한글 CSV 는 BOM 이 없으면 엑셀에서 글자가 깨진다. 앞에 ﻿ 를 반드시 붙일 것.
 */

window.FitLog = window.FitLog || {};

(function (FitLog) {
  'use strict';

  var store = FitLog.store;
  var DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

  /** 쉼표·따옴표·줄바꿈이 든 값은 따옴표로 감싸고 내부 따옴표는 두 번 쓴다 (RFC 4180) */
  function cell(value) {
    if (value === null || value === undefined) return '';
    var s = String(value);
    if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function toCsv(rows) {
    return rows.map(function (row) {
      return row.map(cell).join(',');
    }).join('\r\n');
  }

  function round1(n) {
    return Math.round((Number(n) || 0) * 10) / 10;
  }

  function dayName(dateKey) {
    var p = dateKey.split('-');
    return DAY_NAMES[new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay()];
  }

  /** 기록이 있는 날짜를 과거 → 최근 순으로 */
  function recordedDates(state) {
    var seen = {};
    Object.keys(state.dailyLogs).forEach(function (d) {
      var log = state.dailyLogs[d];
      if (log.meals.length || log.workouts.length || log.supplementsTaken.length) seen[d] = true;
    });
    state.bodyLogs.forEach(function (l) { seen[l.date] = true; });

    return Object.keys(seen).sort();
  }

  /* ---------- 1. 일별 요약 ---------- */

  function dailySummary(state) {
    var targets = state.targets;
    var supp = FitLog.supplements.dailyNutrients(state.supplements);
    var activeSupps = state.supplements.filter(function (s) { return s.enabled !== false; }).length;

    var bodyByDate = {};
    state.bodyLogs.forEach(function (l) { bodyByDate[l.date] = l; });

    var rows = [[
      '날짜', '요일',
      '칼로리', '목표칼로리', '달성률(%)',
      '단백질(g)', '목표단백질(g)',
      '탄수화물(g)', '지방(g)', '식이섬유(g)', '나트륨(mg)',
      '식사수', '근력운동(분)', '유산소(분)',
      '보충제체크', '보충제등록수',
      '체중(kg)', '골격근량(kg)', '체지방률(%)', '허리둘레(cm)',
      '메모'
    ]];

    recordedDates(state).forEach(function (date) {
      var log = state.dailyLogs[date] || store.emptyDay();
      var food = FitLog.foods.sum(log.meals.map(function (m) { return m.nutrients; }));

      // 보충제는 매일 먹는 전제라 그날 하나라도 체크했으면 하루분을 더한다
      var tookAny = log.supplementsTaken.length > 0;
      var kcal = round1(food.kcal + (tookAny ? supp.kcal : 0));
      var protein = round1(food.protein + (tookAny ? supp.protein : 0));

      var strengthMin = 0, cardioMin = 0;
      log.workouts.forEach(function (w) {
        if (w.type === 'strength') strengthMin += Number(w.minutes) || 0;
        else cardioMin += Number(w.minutes) || 0;
      });

      var body = bodyByDate[date] || {};

      rows.push([
        date, dayName(date),
        kcal, targets.calories, targets.calories ? Math.round(kcal / targets.calories * 100) : '',
        protein, targets.protein,
        round1(food.carbs), round1(food.fat), round1(food.fiber), Math.round(food.sodium),
        log.meals.length, strengthMin, cardioMin,
        log.supplementsTaken.length, activeSupps,
        body.weight === undefined ? '' : body.weight,
        body.skeletalMuscle === undefined || body.skeletalMuscle === null ? '' : body.skeletalMuscle,
        body.bodyFatPct === undefined || body.bodyFatPct === null ? '' : body.bodyFatPct,
        body.waistCm === undefined || body.waistCm === null ? '' : body.waistCm,
        log.note || ''
      ]);
    });

    return toCsv(rows);
  }

  /* ---------- 2. 식사 상세 ---------- */

  var MEAL_LABEL = { breakfast: '아침', lunch: '점심', dinner: '저녁', snack: '간식' };
  var MEAL_ORDER = ['breakfast', 'lunch', 'dinner', 'snack'];

  function portionLabel(p) {
    var hit = FitLog.templates.PORTIONS.filter(function (x) { return x.value === p; })[0];
    return hit ? hit.label : String(p);
  }

  function mealDetail(state) {
    var rows = [[
      '날짜', '요일', '끼니', '메뉴', '양', '시각',
      '칼로리', '단백질(g)', '탄수화물(g)', '지방(g)', '식이섬유(g)', '나트륨(mg)',
      '재료', '메모'
    ]];

    recordedDates(state).forEach(function (date) {
      var log = state.dailyLogs[date];
      if (!log || !log.meals.length) return;

      log.meals.slice().sort(function (a, b) {
        return MEAL_ORDER.indexOf(a.type) - MEAL_ORDER.indexOf(b.type);
      }).forEach(function (meal) {
        var n = meal.nutrients || {};
        var items = (meal.items || []).map(function (i) {
          var f = FitLog.foods.get(i.food);
          return (f ? f.name : i.food) + ' ' + i.g + 'g';
        }).join(' + ');

        rows.push([
          date, dayName(date),
          MEAL_LABEL[meal.type] || meal.type,
          meal.label,
          portionLabel(meal.portion),
          meal.time || '',
          Math.round(n.kcal || 0), round1(n.protein), round1(n.carbs),
          round1(n.fat), round1(n.fiber), Math.round(n.sodium || 0),
          items, meal.note || ''
        ]);
      });
    });

    return toCsv(rows);
  }

  /* ---------- 3. 인바디 기록 ---------- */

  function bodyLog(state) {
    var rows = [[
      '날짜', '요일', '체중(kg)', '골격근량(kg)', '체지방률(%)', '체지방량(kg)',
      '복부지방률', '허리둘레(cm)', '체중변화(kg)'
    ]];

    var logs = state.bodyLogs.slice().sort(function (a, b) {
      return a.date < b.date ? -1 : 1;
    });

    logs.forEach(function (l, i) {
      var fatMass = (l.bodyFatPct === null || l.bodyFatPct === undefined)
        ? '' : round1(l.weight * l.bodyFatPct / 100);
      var diff = i === 0 ? '' : round1(l.weight - logs[i - 1].weight);

      rows.push([
        l.date, dayName(l.date), l.weight,
        l.skeletalMuscle === null ? '' : l.skeletalMuscle,
        l.bodyFatPct === null ? '' : l.bodyFatPct,
        fatMass,
        l.visceralRatio === null ? '' : l.visceralRatio,
        l.waistCm === null ? '' : l.waistCm,
        diff
      ]);
    });

    return toCsv(rows);
  }

  /* ---------- 다운로드 ---------- */

  function download(fileName, text) {
    // BOM 이 없으면 한글 엑셀에서 전부 깨져 보인다. 이게 이 함수의 핵심이다.
    var blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);

    var a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  var SHEETS = [
    { key: 'daily',  label: '일별 요약',   file: '일별요약',   build: dailySummary },
    { key: 'meals',  label: '식사 상세',   file: '식사상세',   build: mealDetail },
    { key: 'body',   label: '인바디 기록', file: '인바디기록', build: bodyLog }
  ];

  function exportSheet(key) {
    var sheet = SHEETS.filter(function (s) { return s.key === key; })[0];
    if (!sheet) return null;

    var text = sheet.build(store.load());
    download('fitlog-' + sheet.file + '-' + store.todayKey() + '.csv', text);
    return text;
  }

  FitLog.csv = {
    SHEETS: SHEETS,
    cell: cell,
    toCsv: toCsv,
    dailySummary: dailySummary,
    mealDetail: mealDetail,
    bodyLog: bodyLog,
    exportSheet: exportSheet
  };
})(window.FitLog);

</script>
<script>
/* ui.js — 공통 UI 헬퍼 (DOM 생성, 토스트, SVG 진행 링) */

window.FitLog = window.FitLog || {};

(function (FitLog) {
  'use strict';

  /** el('div', {class:'card'}, [자식...]) 형태의 간단한 DOM 빌더 */
  function el(tag, attrs, children) {
    var node = document.createElement(tag);

    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        var val = attrs[key];
        if (val === null || val === undefined || val === false) return;
        if (key === 'class') node.className = val;
        else if (key === 'text') node.textContent = val;
        else if (key === 'html') node.innerHTML = val;
        else if (key.indexOf('on') === 0 && typeof val === 'function') {
          node.addEventListener(key.slice(2).toLowerCase(), val);
        } else if (key === 'dataset') {
          Object.keys(val).forEach(function (d) { node.dataset[d] = val[d]; });
        } else {
          node.setAttribute(key, val === true ? '' : val);
        }
      });
    }

    appendAll(node, children);
    return node;
  }

  function appendAll(node, children) {
    if (children === null || children === undefined) return;
    if (!Array.isArray(children)) children = [children];
    children.forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      node.appendChild(typeof c === 'string' || typeof c === 'number'
        ? document.createTextNode(String(c))
        : c);
    });
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  /* ---------- 토스트 ---------- */

  var toastTimer = null;

  function toast(message) {
    var box = document.getElementById('toast');
    if (!box) return;
    box.textContent = message;
    box.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.hidden = true; }, 2600);
  }

  /* ---------- 진행 링 (SVG 직접 생성) ---------- */

  var SVG_NS = 'http://www.w3.org/2000/svg';

  function svgEl(tag, attrs) {
    var node = document.createElementNS(SVG_NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    return node;
  }

  /**
   * 진행 링. value/target 비율만큼 채운다.
   * @param {{label:string, value:number, target:number, unit:string, size?:number}} opts
   */
  function progressRing(opts) {
    var size = opts.size || 108;
    var stroke = 10;
    var r = (size - stroke) / 2;
    var c = 2 * Math.PI * r;
    var target = Number(opts.target) || 0;
    var value = Number(opts.value) || 0;
    var ratio = target > 0 ? Math.min(value / target, 1) : 0;

    var svg = svgEl('svg', {
      width: size, height: size, viewBox: '0 0 ' + size + ' ' + size,
      role: 'img',
      'aria-label': opts.label + ' ' + value + ' / ' + target + opts.unit
    });

    svg.appendChild(svgEl('circle', {
      class: 'ring-track', cx: size / 2, cy: size / 2, r: r,
      fill: 'none', 'stroke-width': stroke
    }));

    svg.appendChild(svgEl('circle', {
      class: 'ring-fill', cx: size / 2, cy: size / 2, r: r,
      fill: 'none', 'stroke-width': stroke,
      'stroke-dasharray': c,
      'stroke-dashoffset': c * (1 - ratio),
      transform: 'rotate(-90 ' + (size / 2) + ' ' + (size / 2) + ')'
    }));

    var remain = Math.max(0, Math.round(target - value));
    var mid = svgEl('text', { class: 'ring-center', x: size / 2, y: size / 2 });
    mid.textContent = remain + opts.unit;
    svg.appendChild(mid);

    var sub = svgEl('text', { class: 'ring-center-sub', x: size / 2, y: size / 2 + 16 });
    sub.textContent = '남음';
    svg.appendChild(sub);

    return el('div', { class: 'ring-item' }, [
      svg,
      el('div', { class: 'ring-name', text: opts.label }),
      el('div', { class: 'ring-val', text: Math.round(value) + ' / ' + Math.round(target) + opts.unit })
    ]);
  }

  /**
   * 목표 선택 칩 (복수 선택). 선택 상태는 그룹 안에서 관리하고 변경분만 콜백으로 넘긴다.
   * @param {string[]} initial
   * @param {(goals:string[])=>void} onChange
   */
  function goalChips(initial, onChange) {
    var calc = FitLog.calc;
    var goals = calc.normalizeGoals(initial);
    var group = el('div', { class: 'chips' });
    var buttons = {};

    function sync() {
      calc.GOAL_OPTIONS.forEach(function (opt) {
        buttons[opt.value].setAttribute('aria-pressed', String(goals.indexOf(opt.value) >= 0));
      });
    }

    calc.GOAL_OPTIONS.forEach(function (opt) {
      var btn = el('button', { type: 'button', class: 'chip', text: opt.label });
      btn.addEventListener('click', function () {
        goals = calc.toggleGoal(goals, opt.value);
        sync();
        onChange(goals);
      });
      buttons[opt.value] = btn;
      group.appendChild(btn);
    });

    sync();
    return group;
  }

  /**
   * 라인 차트. 외부 라이브러리 없이 SVG 를 직접 만든다.
   * 값이 없는 날(null)은 선을 잇지 않고 건너뛴다 — 매일 재는 게 아니기 때문.
   *
   * @param {{labels:string[], series:{name,values,axis,color}[], height?:number}} opts
   *   series[].axis: 'left'(기본) | 'right' — 단위가 다른 두 값을 같이 그릴 때 쓴다
   */
  function lineChart(opts) {
    var labels = opts.labels || [];
    var series = (opts.series || []).filter(function (s) {
      return s.values.some(function (v) { return v !== null && v !== undefined; });
    });
    if (!series.length || labels.length < 2) return null;

    var W = 320, H = opts.height || 150;
    var padL = 34, padR = 34, padT = 12, padB = 22;
    var innerW = W - padL - padR;
    var innerH = H - padT - padB;

    // 축별로 값 범위를 따로 잡는다
    var range = {};
    ['left', 'right'].forEach(function (axis) {
      var vals = [];
      series.forEach(function (s) {
        if ((s.axis || 'left') !== axis) return;
        s.values.forEach(function (v) { if (v !== null && v !== undefined) vals.push(Number(v)); });
      });
      if (!vals.length) return;

      var min = Math.min.apply(null, vals);
      var max = Math.max.apply(null, vals);
      if (min === max) { min -= 1; max += 1; }          // 값이 하나뿐이면 납작해지지 않게
      var margin = (max - min) * 0.15;
      range[axis] = { min: min - margin, max: max + margin };
    });

    var svg = svgEl('svg', {
      viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H,
      class: 'chart', role: 'img',
      'aria-label': series.map(function (s) { return s.name; }).join(', ') + ' 추이'
    });

    function xAt(i) {
      return padL + (labels.length === 1 ? innerW / 2 : innerW * i / (labels.length - 1));
    }
    function yAt(v, axis) {
      var r = range[axis];
      return padT + innerH * (1 - (v - r.min) / (r.max - r.min));
    }

    // 가로 눈금 3줄
    [0, 0.5, 1].forEach(function (t) {
      svg.appendChild(svgEl('line', {
        class: 'chart-grid',
        x1: padL, x2: W - padR,
        y1: padT + innerH * t, y2: padT + innerH * t
      }));
    });

    series.forEach(function (s, si) {
      var axis = s.axis || 'left';
      if (!range[axis]) return;

      // null 을 만나면 선을 끊는다
      var d = '', pen = false;
      s.values.forEach(function (v, i) {
        if (v === null || v === undefined) { pen = false; return; }
        var cmd = pen ? 'L' : 'M';
        d += cmd + xAt(i).toFixed(1) + ' ' + yAt(Number(v), axis).toFixed(1) + ' ';
        pen = true;
      });

      svg.appendChild(svgEl('path', {
        class: 'chart-line chart-line-' + si, d: d.trim(), fill: 'none'
      }));

      s.values.forEach(function (v, i) {
        if (v === null || v === undefined) return;
        svg.appendChild(svgEl('circle', {
          class: 'chart-dot chart-dot-' + si,
          cx: xAt(i).toFixed(1), cy: yAt(Number(v), axis).toFixed(1), r: 2.5
        }));
      });

      // 축 값 범위 표기 (왼쪽/오른쪽)
      var r = range[axis];
      var tx = axis === 'left' ? 2 : W - padR + 4;
      [[r.max, padT + 4], [r.min, padT + innerH]].forEach(function (pair) {
        var label = svgEl('text', { class: 'chart-axis', x: tx, y: pair[1] });
